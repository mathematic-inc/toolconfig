#:schema ../../schema/toolconfig.schema.json
# Shared settings. Each package lists the tools it uses in its own source and inherits these.
root = true

[toolconfig]
tools = ["prettier", "oxlint", "typos"]

[toolconfig.files.prettierignore]
path = ".prettierignore"
format = "lines"
config = ["dist/", "coverage/", "target/"]

["*"]
charset = "utf-8"
end_of_line = "lf"
insert_final_newline = true
trim_trailing_whitespace = true
indent_style = "space"
indent_size = 2
max_line_length = 100
spelling_language = "en-US"

["*".oxlint.categories]
correctness = "deny"
suspicious = "deny"

["*.{rs,py,pyi}"]
indent_size = 4

["*.md"]
trim_trailing_whitespace = false

["*.{py,pyi}".ruff]
target-version = "py312"

["*.{py,pyi}".ruff.lint]
select = ["E", "F", "I", "B"]

["*.rs"]
rustfmt.edition = "2024"
