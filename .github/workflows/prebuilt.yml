name: Prebuilt binaries

on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
      verify-install:
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  MANIFEST: Cargo.toml
  CARGO_PACKAGE: toolconfig
  BINARY_NAME: toolconfig
  RELEASE_PREFIX: v

jobs:
  build:
    if: ${{ !inputs.verify-install }}
    permissions:
      contents: read
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: &targets
        include:
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-22.04-arm
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install_args: rust python
          cache: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-${{ matrix.target }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config musl-tools
      - name: Configure target linking
        env:
          TARGET: ${{ matrix.target }}
        run: |
          target_env="$(printf '%s' "$TARGET" | tr '[:lower:]-' '[:upper:]_')"
          if [[ "$TARGET" == *musl ]]; then
            echo "CARGO_TARGET_${target_env}_RUSTFLAGS=-C target-feature=+crt-static"
            # Rust supplies its musl runtime; musl-gcc is for C dependencies.
            echo "CC_${TARGET//-/_}=musl-gcc"
          elif [[ "$TARGET" == *windows* ]]; then
            echo "CARGO_TARGET_${target_env}_RUSTFLAGS=-C target-feature=+crt-static"
          fi >> "$GITHUB_ENV"
      - name: Test, build and package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup target add "$TARGET"
          cargo test --locked --all-targets --target "$TARGET"
          python scripts/package.py --target "$TARGET" --output dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  package-consistency:
    if: ${{ !inputs.verify-install }}
    permissions:
      contents: read
    needs: build
    name: Verify asset consistency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - name: Compare Pkl packages and schemas from every platform build
        run: python3 scripts/release/verify-assets.py dist

  smoke:
    if: ${{ !inputs.verify-install }}
    permissions:
      contents: read
    needs: build
    name: Run archive ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: *targets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binary-${{ matrix.target }}
          path: dist
      - name: Verify checksum and generate the examples with the extracted executable
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cd dist
          mkdir unpack
          if [[ "$TARGET" == *windows* ]]; then
            archive=("$BINARY_NAME"-*-"$TARGET".zip)
            binary="$BINARY_NAME.exe"
          else
            archive=("$BINARY_NAME"-*-"$TARGET".tar.gz)
            binary="$BINARY_NAME"
          fi
          test "${#archive[@]}" -eq 1
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum -c "${archive[0]}.sha256"
          else
            shasum -a 256 -c "${archive[0]}.sha256"
          fi
          if [[ "$TARGET" == *windows* ]]; then
            7z x "${archive[0]}" -ounpack
          else
            tar -xzf "${archive[0]}" -C unpack
          fi
          executable="$PWD/unpack/$binary"
          "$executable" --help > smoke.out
          test -s smoke.out
          for example in unpack/examples/*/; do
            (cd "$example" && "$executable" generate && "$executable" check)
          done

  install:
    if: inputs.verify-install
    permissions:
      contents: read
    name: Install without compiling ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: *targets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install_args: cargo-binstall
          cache: false
      - name: Install published binaries through binstall and mise
        env:
          TARGET: ${{ matrix.target }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(awk -F'"' '/^version = / { print $2; exit }' "$MANIFEST")"
          test -n "$version"
          binary="$BINARY_NAME"
          archive="$BINARY_NAME-$version-$TARGET.tar.gz"
          if [[ "$TARGET" == *windows* ]]; then
            binary="$binary.exe"
            archive="$BINARY_NAME-$version-$TARGET.zip"
          fi
          cargo-binstall "$CARGO_PACKAGE@$version" --no-confirm --disable-telemetry \
            --disable-strategies compile,quick-install --targets "$TARGET" \
            --install-path "$RUNNER_TEMP/binstall" --no-track
          mise install-into \
            "github:${GITHUB_REPOSITORY}[asset_pattern=${archive}]@${RELEASE_PREFIX}${version}" \
            "$RUNNER_TEMP/mise"
          for prefix in "$RUNNER_TEMP/binstall" "$RUNNER_TEMP/mise"; do
            "$prefix/$binary" --help > "$RUNNER_TEMP/smoke.out"
            test -s "$RUNNER_TEMP/smoke.out"
          done
          cmp "$RUNNER_TEMP/binstall/$binary" "$RUNNER_TEMP/mise/$binary"
