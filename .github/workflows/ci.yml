name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

env:
  MSRV: "1.98.1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-msrv:
    name: Check MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install MSRV
        run: rustup toolchain install "$MSRV" --profile minimal
      - name: Check MSRV
        run: rustup run "$MSRV" cargo check --locked --all-targets

  build-and-test:
    name: Build and test
    needs: check-msrv
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build ToolConfig
        run: cargo build --locked
      - name: Add built ToolConfig to PATH
        run: echo "$GITHUB_WORKSPACE/target/debug" >> "$GITHUB_PATH"
      - name: Check and generate ToolConfig files
        uses: mathematic-inc/toolconfig-action@1baf7b021e8bf6f0e20737753c13af0fc93c8570 # v2026.11.0
      - name: Run checks
        run: hk check --all --slow --skip-step toolconfig
      - name: Run tests
        run: cargo test --locked --all-targets
      - name: Run real tools against generated configuration
        run: python tests/native/run.py --toolconfig target/debug/toolconfig
      - name: Verify package
        run: cargo package --locked

  verify-prebuilt-distribution:
    name: Verify prebuilt distribution
    permissions:
      contents: read
    uses: $/.github/workflows/prebuilt.yml

  required:
    name: required
    if: ${{ always() }}
    needs:
      - check-msrv
      - build-and-test
      - verify-prebuilt-distribution
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check every other job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          if ! jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< "$NEEDS" > /dev/null; then
            echo "::error::A job failed or was cancelled."
            exit 1
          fi
