name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  MSRV: "1.98.1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install MSRV
        run: rustup toolchain install "$MSRV" --profile minimal
      - name: Check MSRV
        run: rustup run "$MSRV" cargo check --locked --all-targets

  ci:
    name: CI
    needs: msrv
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build
        run: cargo build --locked
      - name: Put the built ToolConfig on PATH
        run: echo "$GITHUB_WORKSPACE/target/debug" >> "$GITHUB_PATH"
      - name: Check and generate the ToolConfig files
        uses: mathematic-inc/toolconfig-action@1baf7b021e8bf6f0e20737753c13af0fc93c8570 # v2026.11.0
      - name: Run hk
        run: hk check --all --slow --skip-step toolconfig
      - name: Test
        run: cargo test --locked --all-targets
      - name: Run real tools against generated configuration
        run: python tests/native/run.py --toolconfig target/debug/toolconfig
      - name: Verify package
        run: cargo package --locked

  prebuilt:
    permissions:
      contents: read
    name: Verify prebuilt distribution
    uses: $/.github/workflows/prebuilt.yml
