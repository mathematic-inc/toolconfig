name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  MSRV: "1.98.1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install MSRV
        run: rustup toolchain install "$MSRV" --profile minimal
      - name: Check MSRV
        run: rustup run "$MSRV" cargo check --locked --all-targets

  ci:
    name: CI
    needs: msrv
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Audit dependencies
        run: cargo-deny --locked check
      - name: Test
        run: cargo test --locked --all-targets
      - name: Run real tools against generated configuration
        run: |
          cargo build --locked
          python tests/native/run.py --toolconfig target/debug/toolconfig
      - name: Check this repository's own generated files
        run: target/debug/toolconfig check --strict
      - name: Verify package
        run: cargo package --locked

  prebuilt:
    permissions:
      contents: read
    name: Verify prebuilt distribution
    uses: ./.github/workflows/prebuilt.yml # zizmor: ignore[self-repository] actionlint rejects the alternative syntax.
