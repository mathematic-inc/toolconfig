# A description has 25 words or fewer. The count takes a code span out, and counts text in parentheses
# and in double quotation marks as one word. A heading is a label, so the rule skips it.
# A step has its own limit (StepLength).
extends: occurrence
message: "The sentence has %d words. Use 25 words or fewer in a description, and 20 or fewer in a step or a commit subject."
link: https://github.com/mathematic-inc/toolconfig#the-ste-style
level: warning
scope: sentence & ~heading & ~doc(ol > li)
max: 25
token: '\([^()]*\)|"[^"]*"|\S*\w\S*'
