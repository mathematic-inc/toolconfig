# An -ing form is a progressive tense, a gerund or a participle. Use a simple tense.
# A technical noun can have an -ing form. Add it to the vocabulary's accepted terms, and this rule stops reporting it.
# The words in the first group are not -ing forms.
extends: existence
message: "Do not use the -ing form '%s'. Use a simple tense. If it is a technical noun, add it to the vocabulary."
link: https://github.com/mathematic-inc/toolconfig#the-ste-style
level: warning
ignorecase: true
raw:
  - '(?<![\w/_.@])(?!(?:string|strings|thing|things|something|anything|nothing|everything|during|bring|spring|sting|swing|cling|fling|sling|ceiling|sibling|morning|evening|warning|warnings)\b)[A-Za-z]{2,}ing(?![\w/_@]|\.\w)'
