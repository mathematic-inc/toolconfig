[package]
name = "toolconfig"
version = "2026.10.0"
edition = "2024"
rust-version = "1.98"
description = "EditorConfig, extended to your tools: generate .editorconfig and native tool configuration from TOML or Pkl"
license = "MIT"
repository = "https://github.com/mathematic-inc/toolconfig"
authors = ["Mathematic Inc."]
categories = ["command-line-utilities", "development-tools"]
keywords = ["editorconfig", "configuration", "formatter", "linter", "cli"]
readme = "README.md"
include = [
  "Cargo.lock",
  "Cargo.toml",
  "LICENSE",
  "README.md",
  "build.rs",
  "docs/**",
  "examples/**",
  "schema/**",
  "src/**",
]
build = "build.rs"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/toolconfig-{ version }-{ target }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/toolconfig-{ version }-{ target }.zip"
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/toolconfig-{ version }-{ target }.zip"
pkg-fmt = "zip"

[[bin]]
name = "toolconfig"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
dirs = "7.0.0"
ec4rs = "1.2.0"
fs2 = "0.4.3"
ignore = "0.4.33"
notify = "8.2.1"
pklr = "=5.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip", "preserve_order"] }
sha2 = "0.11.1"
tempfile = "3.27.0"
toml = { version = "1.1.8", features = ["preserve_order"] }
toml_edit = "0.25.17"

[dev-dependencies]
insta = "1.49.0"

[build-dependencies]
serde_json = "1.0.154"
sha2 = "0.11.1"
zip = { version = "9.1.2", default-features = false, features = ["deflate"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[lints.rust]
unreachable_pub = "warn"

[profile.release]
strip = "debuginfo"
lto = "thin"
