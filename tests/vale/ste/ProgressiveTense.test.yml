- name: reports a form of be with an -ing form
  rule: ProgressiveTense.yml
  input: |
    The job is running now. The hosts are starting the jobs. The job was being stopped.
    The job has been failing. The job is not yet starting.
  contains:
    - "'is running'"
    - "'are starting'"
    - "'was being'"
    - "'been failing'"
    - "'is not yet starting'"
- name: leaves a noun alone
  rule: ProgressiveTense.yml
  input: The value is a string. The cause is nothing. The log is something. The job is during the test.
  absent: STE.ProgressiveTense
- name: leaves a signal word alone
  rule: ProgressiveTense.yml
  input: The label is warning text.
  absent: STE.ProgressiveTense
