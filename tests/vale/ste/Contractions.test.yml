- name: reports n't
  rule: Contractions.yml
  input: Don't stop the job. The job can't start.
  contains:
    - "'Don't'"
    - "'can't'"
- name: reports 's, 're, 've, 'll, 'd and 'm
  rule: Contractions.yml
  input: It's here. They're here. We've set it. You'll see it. He'd go. I'm here. Let's go.
  contains:
    - "'It's'"
    - "'They're'"
    - "'We've'"
    - "'You'll'"
    - "'He'd'"
    - "'I'm'"
    - "'Let's'"
- name: reports a typographic apostrophe
  rule: Contractions.yml
  input: The job doesn’t start.
  contains: "'doesn’t'"
- name: leaves a possessive alone
  rule: Contractions.yml
  input: The runner's label is not set.
  absent: STE.Contractions
- name: leaves a lifetime alone
  rule: Contractions.yml
  input: Use the 'static lifetime.
  absent: STE.Contractions
- name: leaves a code span alone
  rule: Contractions.yml
  input: Use the `don't` flag.
  absent: STE.Contractions
