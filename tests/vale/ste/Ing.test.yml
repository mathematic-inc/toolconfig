- name: reports an -ing form
  rule: Ing.yml
  input: Stop the running job. Waiting is not a plan.
  contains:
    - "'running'"
    - "'Waiting'"
- name: leaves a word that is not an -ing form alone
  rule: Ing.yml
  input: Use a string. Do nothing during the test. WARNING Stop the job. Bring the host back.
  absent: STE.Ing
- name: leaves a path and an identifier alone
  rule: Ing.yml
  input: The file is src/building.rs, and the type is parse_building or building.rs.
  absent: STE.Ing
- name: reports an -ing form before a full stop
  rule: Ing.yml
  input: Stop the building.
  contains: "'building'"
